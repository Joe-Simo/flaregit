<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>(()=>{let theme="system";try{theme=localStorage.getItem("flaregit.theme")||"system";}catch{}const dark=theme==="dark"||(theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",dark);document.documentElement.style.colorScheme=dark?"dark":"light";})();</script>
    <script>window.addEventListener('error',event=>{const title=document.getElementById('app-loading-title');if(title&&(event.target instanceof HTMLScriptElement||event instanceof ErrorEvent)){title.textContent='FlareGit could not load';document.getElementById('app-loading-detail').textContent='Reload to get the current application. Saved repository history remains preserved.';document.getElementById('app-loading-reload').hidden=false;}},true);</script>
    <link rel="icon" type="image/svg+xml" href="./public/flaregit-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>.static-hero{max-width:40rem;margin:14vh auto 0;padding:0 16px;font-family:Inter,system-ui,-apple-system,sans-serif;color:#1a1a1a}html.dark body{background:#0d0d0d}html.dark .static-hero{color:#f0f0f0}.static-hero-eyebrow{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#c2410c}html.dark .static-hero-eyebrow{color:#fb923c}.static-hero h1{margin:0;font-size:clamp(32px,7vw,52px);line-height:1.05;letter-spacing:-.02em}.static-hero-copy{margin:20px 0 0;font-size:17px;line-height:1.55;opacity:.8}.static-hero-status{margin-top:28px;font-size:14px;opacity:.75}.static-hero button{margin-top:16px;padding:10px 16px;border:1px solid currentColor;border-radius:6px;background:transparent;color:inherit;font:inherit}.static-hero button:focus-visible{outline:2px solid #ea580c;outline-offset:2px}</style>
    <title>FlareGit | Work in parallel. Review what comes together.</title>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen font-sans">
    <div id="root"><main class="static-hero" aria-labelledby="static-hero-title"><p class="static-hero-eyebrow">Git for people and agents</p><h1 id="static-hero-title">Work in parallel.<br />Review what comes together.</h1><p class="static-hero-copy">Every person and coding agent gets an isolated Git workspace. FlareGit combines ready changes into one preview, runs your checks, and merges only what you approve.</p><p role="status" class="static-hero-status"><strong id="app-loading-title">Opening FlareGit…</strong> <span id="app-loading-detail">Connecting to the application.</span></p><button id="app-loading-reload" hidden onclick="window.location.reload()">Reload FlareGit</button><noscript><p>Enable JavaScript to open FlareGit.</p></noscript></main></div>
    <script type="module" src="./src/web/main.tsx"></script>
  </body>
</html>
